<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade - Manipulando HTML e JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Atividade JavaScript</h1>
      <h2 id="area">Bem-vindo!</h2>

      <button onclick="entrar()">Acessar</button>
    </section>

    <section class="card">
      <h2>Calcular Média de Três Notas</h2>

      <form id="formNotas">
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" step="0.1" min="0" max="10" required>

        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" step="0.1" min="0" max="10" required>

        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" step="0.1" min="0" max="10" required>

        <button type="submit">Calcular Média</button>
      </form>

      <p id="resultadoMedia">Preencha as notas para ver o resultado.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
